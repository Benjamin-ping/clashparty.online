name: Sync official Clash Party releases
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install storage client
        if: vars.R2_MIRROR_ENABLED == 'true'
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Fetch official release facts
        run: npm run sync:releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: python -m unittest discover -s scripts -p 'test_mirror.py'
      - name: Synchronize latest stable downloads
        run: python -u scripts/sync-mirror.py
        env:
          R2_MIRROR_ENABLED: ${{ vars.R2_MIRROR_ENABLED }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      - run: npm run build
      - run: npm run check
      - name: Save verified release data
        id: save
        shell: bash
        run: |
          if git diff --quiet -- content/releases.json content/download-mirror.json content/page-metadata.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/releases.json content/download-mirror.json content/page-metadata.json
          git commit -m "content: sync official Clash Party releases"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger optional Cloudflare Pages deploy hook
        if: steps.save.outputs.changed == 'true' && vars.CLOUDFLARE_WORKERS_DEPLOY != 'true'
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: node scripts/deploy-hook.mjs
      - name: Install deployment dependencies
        if: vars.CLOUDFLARE_WORKERS_DEPLOY == 'true'
        run: npm ci
      - name: Deploy current site to Cloudflare Workers
        if: vars.CLOUDFLARE_WORKERS_DEPLOY == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INDEXNOW_SKIP: ${{ steps.save.outputs.changed != 'true' && github.event_name != 'workflow_dispatch' }}
